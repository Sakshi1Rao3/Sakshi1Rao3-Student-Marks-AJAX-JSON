<!DOCTYPE html>
<html>
<head>
  <title>AJAX JSON </title>
  <style>
    body {
      font-family: Arial;
      background: linear-gradient(135deg,#a1c4fd,#c2e9fb);
      text-align: center;
      padding: 40px;
    }
    .card {
      background: #fff;
      width: 80%;
      max-width: 700px;
      margin: auto;
      padding: 20px;
      border-radius: 15px;
      box-shadow: 0 6px 18px #0003;
    }
    button {
      padding: 10px 20px;
      background: #0066cc;
      color: #fff;
      border: 0;
      border-radius: 8px;
      cursor: pointer;
      font-size: 16px;
    }
    button:hover { background:#004b99; }
    table {
      width: 90%;
      margin: 20px auto;
      border-collapse: collapse;
      box-shadow: 0 4px 12px #0004;
      border-radius: 10px;
      overflow: hidden;
    }
    th,td { padding:12px; border-bottom:1px solid #ddd; }
    th { background:#003366; color:white; }
    tr:nth-child(even){ background:#eef6ff; }
    tr:hover{ background:#d6ebff; }
  </style>
</head>

<body>

<h2>Student Marks</h2>

<div class="card">
  <button onclick="loadData()">Load Students</button>
  <div id="result"></div>
</div>

<script>
function loadData(){
  fetch("students.json")
    .then(res=>res.json())
    .then(data=>{
      let table = `<table><tr><th>Name</th><th>Marks</th></tr>`;
      data.forEach(s => table += `<tr><td>${s.name}</td><td>${s.marks}</td></tr>`);
      table += `</table>`;
      document.getElementById("result").innerHTML = table;
    });
}
</script>

</body>
</html>
